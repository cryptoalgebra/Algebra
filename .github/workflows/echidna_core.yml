name: Echidna Core

on:
  push:
    branches:
      - integral-v1.3
  pull_request:
    branches:
      - integral-v1.3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  IntegrationInvariants:
    strategy:
      matrix:
        testName:
          - PropBalancesEchidnaTest
          - PropFeeTokenIsolationEchidnaTest
          - PropReservesEchidnaTest

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm run ci-install

      - name: Compile contracts
        run: npm run compile
        working-directory: ./src/core

      - name: Run ${{ matrix.testName }}
        uses: crytic/echidna-action@f7e374e42bf7131f7307a92f5549ed6b2fd17c9d # v2.0.2
        with:
          solc-version: 0.8.20
          files: ./src/core/contracts/test/echidna/PoolMockEchidna/${{ matrix.testName }}.sol
          contract: ${{ matrix.testName }}
          crytic-args: --hardhat-ignore-compile
          solc-args: --evm-version paris
          config: ./src/core/contracts/test/echidna/PoolMockEchidna/echidna-property.config.yml

  IntegrationAsserts:
    strategy:
      matrix:
        testName:
          - AssertFeeModeSwapEchidnaTest
          - AssertSwapEchidnaTest

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm run ci-install

      - name: Compile contracts
        run: npm run compile
        working-directory: ./src/core

      - name: Run ${{ matrix.testName }}
        uses: crytic/echidna-action@f7e374e42bf7131f7307a92f5549ed6b2fd17c9d # v2.0.2
        with:
          solc-version: 0.8.20
          files: ./src/core/contracts/test/echidna/PoolMockEchidna/${{ matrix.testName }}.sol
          contract: ${{ matrix.testName }}
          crytic-args: --hardhat-ignore-compile
          solc-args: --evm-version paris
          config: ./src/core/contracts/test/echidna/PoolMockEchidna/echidna-assert.config.yml

  UnitAsserts:
    strategy:
      matrix:
        testName:
          - BitMathEchidnaTest
          - FullMathEchidnaTest
          - LiquidityMathEchidnaTest
          - LowGasSafeMathEchidnaTest
          - PriceMovementMathEchidnaTest
          - TickMathEchidnaTest
          - TickOverflowSafetyEchidnaTest
          - TickTreeSearchEchidnaTest
          - TickTreeEchidnaTest
          - TokenDeltaMathEchidnaTest
          - UnsafeMathEchidnaTest

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm run ci-install

      - name: Compile contracts
        run: npm run compile
        working-directory: ./src/core

      - name: Run ${{ matrix.testName }}
        uses: crytic/echidna-action@f7e374e42bf7131f7307a92f5549ed6b2fd17c9d # v2.0.2
        with:
          solc-version: 0.8.20
          files: ./src/core/contracts/test/echidna/${{ matrix.testName }}.sol
          contract: ${{ matrix.testName }}
          crytic-args: --hardhat-ignore-compile
          solc-args: --evm-version paris
          config: ./src/core/contracts/test/echidna/echidna.config.yml
