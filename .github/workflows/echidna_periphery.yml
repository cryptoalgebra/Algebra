name: Echidna Periphery

on:
  push:
    branches:
      - integral-v1.3
  pull_request:
    branches:
      - integral-v1.3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  UnitAsserts:
    strategy:
      matrix:
        testName:
          - TickLensEchidnaTest

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm run ci-install

      - name: Compile contracts
        run: npm run compile
        working-directory: ./src/periphery

      - name: Run ${{ matrix.testName }}
        uses: crytic/echidna-action@f7e374e42bf7131f7307a92f5549ed6b2fd17c9d # v2.0.2
        with:
          solc-version: 0.8.20
          files: ./src/periphery/
          contract: ${{ matrix.testName }}
          solc-args: --evm-version paris
          config: ./src/periphery/contracts/test/echidna/echidna.config.yml
