# Property mode for the stateful pool suites. Run per file as in CI, `echidna .` fails on them (crytic/echidna#1118):
#   echidna contracts/test/echidna/PoolMockEchidna/PropReservesEchidnaTest.sol --contract PropReservesEchidnaTest \
#     --config echidna.property.yaml --solc-args '--evm-version cancun'
# The same for PropBalancesEchidnaTest and PropFeeTokenIsolationEchidnaTest

# CI runs these suites shorter, with contracts/test/echidna/PoolMockEchidna/echidna-property.config.yml.
# Keep filterFunctions identical in both

testMode: property
testLimit: 500000
seqLen: 100
shrinkLimit: 5000

# the fee token is pinned, so the fee mode setters and `flash` (fees in both tokens) are excluded;
# the entries must name the contract under test, the other suites ignore them
filterFunctions: ["PropFeeTokenIsolationEchidnaTest.setFeeMode(uint8)", "PropFeeTokenIsolationEchidnaTest.setFeeModeWrapped(uint8)", "PropFeeTokenIsolationEchidnaTest.flash(address,uint256,uint256,bytes)"]
filterBlacklist: true

# the pool mock mints its own balances in the callbacks, so no funding is needed
balanceContract: 0
balanceAddr: 0

# the pool mocks exceed the 24576 byte code size limit
codeSize: 0xffffffff

corpusDir: echidna-corpus-property
coverage: true
