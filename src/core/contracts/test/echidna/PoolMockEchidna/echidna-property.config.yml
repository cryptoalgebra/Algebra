# CI config of the property suites in this folder. src/core/echidna.property.yaml runs the same suites locally,
# longer and with coverage. Keep filterFunctions identical in both
#format can be "text" or "json" for different output (human or machine readable)
format: 'text'
testMode: "property"
#coverage controls coverage guided testing
coverage: false
# The fee token is pinned per suite, so the setters that could move it and the raw `flash`, which pays fees in both tokens, stay out.
# The entry has to name the contract under test even though both functions are inherited: a bare signature,
# or the declaring contract, is silently ignored. Entries that match nothing are harmless for the other suites
filterFunctions: ["PropFeeTokenIsolationEchidnaTest.setFeeMode(uint8)", "PropFeeTokenIsolationEchidnaTest.setFeeModeWrapped(uint8)", "PropFeeTokenIsolationEchidnaTest.flash(address,uint256,uint256,bytes)"]
filterBlacklist: true
