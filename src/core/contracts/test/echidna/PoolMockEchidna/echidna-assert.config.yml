# CI config of the assertion suites in this folder. src/core/echidna.assertion.yaml runs the same suites locally,
# longer and with coverage. Keep filterFunctions identical in both
#format can be "text" or "json" for different output (human or machine readable)
format: 'text'
testMode: "assertion"
#coverage controls coverage guided testing
coverage: false
# The solvency check drains the positions it tracks, so positions it cannot see must not exist: the raw `mint`
# stays out. The entry names the contract under test, as a bare signature is silently ignored
filterFunctions: ["AssertFeeModeSwapEchidnaTest.mint(address,address,int24,int24,uint128,bytes)"]
filterBlacklist: true
