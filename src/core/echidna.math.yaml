# Assertion mode for the stateless math libraries: the calls are independent, so `seqLen: 1`
#   echidna . --contract PriceMovementMathEchidnaTest --config echidna.math.yaml --workers 4
# The same for TokenDeltaMathEchidnaTest and FullMathEchidnaTest. Before a campaign run
# `npx hardhat clean && npx hardhat compile`: crytic-compile also reads the stale build-info of incremental builds

testMode: assertion
testLimit: 2000000
seqLen: 1
shrinkLimit: 5000

corpusDir: echidna-corpus-math
coverage: true

cryticArgs: ['--hardhat-ignore-compile']
