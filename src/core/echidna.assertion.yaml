# Assertion mode for the stateful pool suites. Run per file as in CI, `echidna .` fails on them (crytic/echidna#1118):
#   echidna contracts/test/echidna/PoolMockEchidna/AssertSwapEchidnaTest.sol --contract AssertSwapEchidnaTest \
#     --config echidna.assertion.yaml --solc-args '--evm-version cancun'
# The same for AssertFeeModeSwapEchidnaTest, AssertDeltasEchidnaTest and AssertFeeSplitEchidnaTest

# CI runs these suites shorter, with contracts/test/echidna/PoolMockEchidna/echidna-assert.config.yml.
# Keep filterFunctions identical in both

testMode: assertion
testLimit: 500000
seqLen: 50
shrinkLimit: 5000

# the solvency check sees only the tracked positions, so the raw `mint` is excluded; a bare signature is ignored
filterFunctions: ["AssertFeeModeSwapEchidnaTest.mint(address,address,int24,int24,uint128,bytes)"]
filterBlacklist: true

# the pool mock mints its own balances in the callbacks, so no funding is needed
balanceContract: 0
balanceAddr: 0

# the pool mocks exceed the 24576 byte code size limit
codeSize: 0xffffffff

corpusDir: echidna-corpus-assertion
coverage: true
