#format can be "text" or "json" for different output (human or machine readable)
format: 'text'
#checkAsserts checks assertions
testMode: 'assertion'
#coverage controls coverage guided testing
coverage: false
# Deploy libraries at specific addresses
deployContracts: 
  - ["0x10000", "NFTDescriptor"]
  - ["0x20000", "NFTSVG"]
# Use hardhat to compile and link libraries
cryticArgs: 
  - '--compile-force-framework'
  - 'hardhat'
  - '--compile-libraries=(NFTDescriptor,0x10000),(NFTSVG,0x20000)'
# Only test the specified contract, not all contracts in the compilation
allContracts: false
# #directory to save the corpus; by default is disabled
# corpusDir: null
